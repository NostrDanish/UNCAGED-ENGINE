    <body>
        <div id="root">
            <!-- Boot placeholder: replaced the moment React mounts. If the JS
                 bundle fails to load (e.g. a stale cached page referencing a
                 deleted build), the user sees this instead of a white screen. -->
            <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:hsl(230 21% 6%);color:hsl(210 40% 96%);font-family:ui-sans-serif,system-ui,sans-serif;padding:24px;text-align:center;">
                <div style="width:40px;height:40px;border-radius:12px;border:1px solid hsl(263 70% 58% / 0.4);background:hsl(263 70% 58% / 0.12);display:flex;align-items:center;justify-content:center;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="hsl(263 70% 68%)" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
                </div>
                <p style="margin:0;font-size:15px;color:hsl(215 20% 65%);">Loading Uncaged Engine&hellip;</p>
                <p style="margin:0;font-size:12px;color:hsl(215 20% 45%);max-width:320px;">
                    If this doesn't go away, hard-refresh the page
                    (<kbd style="font-family:ui-monospace,monospace;border:1px solid hsl(230 16% 25%);border-radius:4px;padding:1px 5px;">Ctrl</kbd>+<kbd style="font-family:ui-monospace,monospace;border:1px solid hsl(230 16% 25%);border-radius:4px;padding:1px 5px;">Shift</kbd>+<kbd style="font-family:ui-monospace,monospace;border:1px solid hsl(230 16% 25%);border-radius:4px;padding:1px 5px;">R</kbd>)
                    to clear a stale cached build.
                </p>
            </div>
        </div>
